services:
  proxy:
    depends_on:
      - app
    image: $NGINX_VERSION
    restart: always
    volumes:
      - ./etc/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
  app:
    image: registry.$DOMAIN_NAME/express-mongodb-prod
    build:
      target: prod
    restart: always
    environment:
      NODE_ENV: production
  db:
    restart: always
