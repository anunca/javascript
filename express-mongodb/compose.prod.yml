services:
  proxy:
    depends_on:
      - app
    image: $NGINX_IMAGE
    restart: always
    volumes:
      - ./etc/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
  app:
    build:
      target: prod
    restart: always
    environment:
      NODE_ENV: production
  db:
    restart: always
