services:
  app:
    depends_on:
      - db
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE:
    image: registry.$DOMAIN_NAME/serverless-dynamodb
    ports:
      - 80:3000
    volumes:
      - ./src:/app
      - node_modules:/app/node_modules
      - ~/.aws:/root/.aws
    environment:
      NODE_ENV:
      SLS_DEBUG:
  db:
    image: $DYNAMODB_VERSION
    ports:
      - 8000:8000
    volumes:
      - db:/home/dynamodblocal
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath "."
volumes:
  node_modules:
  db:
